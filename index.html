<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>panton.io</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.03), transparent 22%),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.02),
          transparent 25%,
          transparent 75%,
          rgba(255,255,255,0.02)
        );
      pointer-events: none;
    }

    /* background stars */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 85% 60%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.9), transparent),
        radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,0.8), transparent);
      animation: stars 6s ease-in-out infinite alternate;
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes stars {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-8px);
      }
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 1.5rem;
      place-items: center;
      padding: 1.5rem;
    }

    .magic-title {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: clamp(2.8rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.08em;
      color: rgba(255,255,255,0.96);
      text-shadow:
        0 0 25px rgba(255,255,255,0.12),
        0 0 60px rgba(255,255,255,0.08);
      user-select: none;
    }

    .magic-title .star {
      font-size: 0.4em;
      opacity: 0.9;
      animation: sparkle 2s ease-in-out infinite alternate;
    }

    .magic-title .star:nth-child(1) {
      animation-delay: 0s;
    }

    .magic-title .star:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes sparkle {
      from {
        transform: scale(1) rotate(0deg);
        opacity: 0.5;
      }

      to {
        transform: scale(1.35) rotate(20deg);
        opacity: 1;
      }
    }

    .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.45);
      text-shadow: 0 0 12px rgba(255,255,255,0.15);
      user-select: none;
    }

    .timer {
      padding: 1rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 1.25rem;

      box-shadow:
        0 0 30px rgba(255,255,255,0.06),
        0 20px 50px rgba(0,0,0,0.45);

      font-size: clamp(1.4rem, 5vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      color: rgba(255,255,255,0.92);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255,255,255,0.15);
      user-select: none;
      min-width: max-content;
    }

    @media (max-width: 640px) {
      .content {
        gap: 1.2rem;
      }

      .magic-title {
        gap: 0.7rem;
      }

      .timer {
        padding: 0.9rem 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="content">

    <div class="magic-title">
      <span class="star">✦</span>
      <span>magic moment</span>
      <span class="star">✦</span>
    </div>

    <div class="label">
      Will bE iN
    </div>

    <div class="timer" id="timer">
      --d --h --m --s
    </div>

  </div>

  <script>
    const target = new Date("2026-05-20T21:30:00+01:00").getTime();
    const timer = document.getElementById("timer");

    function updateTimer() {
      const diff = target - Date.now();

      if (diff <= 0) {
        timer.textContent = "0d 0h 0m 0s";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timer.textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
