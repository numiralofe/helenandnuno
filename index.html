<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>helenandnuno</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(circle at top, #101a2f 0%, #060912 35%, #02040a 70%, #000000 100%);

      background-color: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
    }

    /* atmospheric glow */
    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at 50% 20%, rgba(90,120,255,0.12), transparent 30%),
        radial-gradient(circle at 15% 25%, rgba(255,255,255,0.04), transparent 20%),
        radial-gradient(circle at 85% 30%, rgba(120,160,255,0.05), transparent 25%),
        radial-gradient(circle at bottom, rgba(20,30,60,0.35), transparent 55%);

      pointer-events: none;
    }

    /* stars */
    body::after {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.95), transparent),
        radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.85), transparent),
        radial-gradient(2px 2px at 85% 60%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.9), transparent),
        radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,0.75), transparent),
        radial-gradient(2px 2px at 75% 85%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 30% 15%, rgba(255,255,255,0.9), transparent);

      animation: starsFloat 8s ease-in-out infinite alternate;
      opacity: 0.9;
      pointer-events: none;
    }

    @keyframes starsFloat {
      from {
        transform: translateY(0px);
      }

      to {
        transform: translateY(-10px);
      }
    }

    .content {
      position: relative;
      z-index: 2;

      display: grid;
      gap: 1.4rem;
      place-items: center;

      padding: 1.5rem;
    }

    .magic-title {
      display: flex;
      align-items: center;
      gap: 1rem;

      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.08em;

      color: rgba(255,255,255,0.97);

      text-shadow:
        0 0 20px rgba(255,255,255,0.10),
        0 0 60px rgba(120,160,255,0.08);

      user-select: none;
    }

    .magic-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.88;
    }

    .magic-text span:last-child {
      margin-top: -0.08em;
    }

    .magic-title .star {
      font-size: 0.38em;
      opacity: 0.95;

      animation: sparkle 2s ease-in-out infinite alternate;

      align-self: flex-start;
      margin-top: 0.35em;
    }

    .magic-title .star:nth-child(1) {
      animation-delay: 0s;
    }

    .magic-title .star:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes sparkle {
      from {
        transform: scale(1) rotate(0deg);
        opacity: 0.5;
      }

      to {
        transform: scale(1.35) rotate(20deg);
        opacity: 1;
      }
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;

      color: rgba(255,255,255,0.45);

      text-shadow:
        0 0 12px rgba(255,255,255,0.10);

      user-select: none;
    }

    .timer {
      padding: 1rem 1.6rem;

      border: 1px solid rgba(255,255,255,0.10);

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.03)
        );

      backdrop-filter: blur(16px);

      border-radius: 1.3rem;

      box-shadow:
        0 0 35px rgba(120,160,255,0.08),
        0 20px 60px rgba(0,0,0,0.55);

      font-size: clamp(1.4rem, 5vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.04em;

      color: rgba(255,255,255,0.96);

      font-variant-numeric: tabular-nums;

      text-shadow:
        0 0 20px rgba(255,255,255,0.14);

      user-select: none;
      min-width: max-content;
    }

    @media (max-width: 640px) {
      .content {
        gap: 1.2rem;
      }

      .magic-title {
        gap: 0.7rem;
      }

      .timer {
        padding: 0.9rem 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="content">

    <div class="magic-title">

      <span class="star">✦</span>

      <span class="magic-text">
        <span>magic</span>
        <span>moment</span>
      </span>

      <span class="star">✦</span>

    </div>

    <div class="label">
      Will bE iN
    </div>

    <div class="timer" id="timer">
      --d --h --m --s
    </div>

  </div>

  <script>
    const target = new Date("2026-05-20T22:00:00+01:00").getTime();
    const timer = document.getElementById("timer");

    function updateTimer() {
      const diff = target - Date.now();

      if (diff <= 0) {
        timer.textContent = "0d 0h 0m 0s";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timer.textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
